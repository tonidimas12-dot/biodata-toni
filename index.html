<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biodata Toni Dimas Arianto</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #07111f, #102b4e);
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .kartu {
            width: 100%;
            max-width: 420px;
            padding: 30px 22px;
            border: 1px solid #268bff;
            border-radius: 20px;
            background: #101d30;
            box-shadow: 0 0 25px #087cff55;
            text-align: center;
        }

        .lingkaran {
            width: 90px;
            height: 90px;
            margin: 0 auto 18px;
            border-radius: 50%;
            background: #173c66;
            border: 3px solid #48a0ff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 35px;
        }

        h1 {
            color: #69b3ff;
            font-size: 25px;
        }

        .garis {
            height: 2px;
            background: #268bff;
            margin: 20px 0;
        }

        .data {
            text-align: left;
            line-height: 1.8;
        }

        .data p {
            border-bottom: 1px solid #2b3b50;
            padding-bottom: 8px;
        }

        .label {
            color: #69b3ff;
            font-weight: bold;
        }

        footer {
            margin-top: 25px;
            color: #a8bad0;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="kartu">
        <div class="lingkaran">👨‍💻</div>
        <h1>Toni Dimas Arianto</h1>
        <p>Pelajar Teknik Komputer dan Jaringan</p>

        <div class="garis"></div>

        <div class="data">
            <p><span class="label">Nama:</span> Toni Dimas Arianto</p>
            <p><span class="label">Kelas:</span> 12 TKJ</p>
            <p><span class="label">Jurusan:</span> Teknik Komputer dan Jaringan</p>
            <p><span class="label">Hobi:</span> Mengisi waktu dengan hal positif</p>
            <p><span class="label">Cita-cita:</span> Menjadi ahli teknologi</p>
        </div>

        <footer>© 2026 Biodata Toni Dimas Arianto</footer>
    </div>
</body>
</html>
